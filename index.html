<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MALI TOK</title>
<style>
:root{--g:#14B53A;--y:#FCD116;--r:#CE1126;--bg:#050505;--fg:#fff;--mute:#c9c9c9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1;min-height:0}
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#111}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.none{padding:40% 28px 0;text-align:center;color:var(--mute);font-size:16px;line-height:1.5}
.info{position:absolute;left:16px;right:84px;bottom:18px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.info b{display:block;font-size:16px;margin-bottom:4px}.info span{font-size:14px;line-height:1.4}
.rail{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rail svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rail .on svg{fill:var(--r);stroke:var(--r)}
.top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:5;pointer-events:none}
.logo{font-weight:800;font-size:20px;letter-spacing:1px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.logo i{font-style:normal;color:var(--g)}.logo u{text-decoration:none;color:var(--r)}
.logo em{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--y);margin:0 4px 3px}
.snd{pointer-events:auto;background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
nav{display:flex;align-items:center;justify-content:space-around;height:56px;background:#000;border-top:1px solid #222}
nav button{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;padding:8px 18px}
nav .add{width:52px;height:34px;border-radius:10px;padding:0;color:#000;font-size:26px;font-weight:700;line-height:34px;background:linear-gradient(90deg,var(--g) 33%,var(--y) 33% 66%,var(--r) 66%)}
button:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:#1a1a1a;border-radius:16px 16px 0 0;z-index:10;display:none;flex-direction:column}
.sheet.open{display:flex}
.sh{display:flex;justify-content:space-between;padding:14px 16px;font-weight:600;border-bottom:1px solid #2c2c2c}
.sh button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.list{flex:1;overflow-y:auto;padding:10px 16px;font-size:14px;line-height:1.4}
.c{margin-bottom:12px}.c b{color:var(--y)}
.add-c{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #2c2c2c}
.add-c input{flex:1;min-width:0;background:#2a2a2a;border:0;border-radius:18px;color:#fff;padding:10px 14px;font-size:16px}
.add-c button{background:var(--g);border:0;border-radius:18px;color:#fff;font-weight:600;padding:0 16px;cursor:pointer}
.add-c button:disabled{opacity:.5}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:18px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.auth{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px}
.auth .logo{font-size:34px;text-align:center;margin-bottom:8px}
.auth input{background:#1f1f1f;border:1px solid #333;border-radius:10px;color:#fff;padding:13px 14px;font-size:16px;width:100%}
.auth .go{background:var(--g);border:0;border-radius:10px;color:#fff;font-weight:700;font-size:16px;padding:13px;cursor:pointer}
.auth .go:disabled{opacity:.5}
.auth .alt{background:none;border:0;color:var(--y);font-size:14px;cursor:pointer;padding:6px}
.err{color:#ff7b7b;font-size:14px;min-height:20px;text-align:center}
</style></head>
<body>
<div class="stage">
  <div class="top"><div class="logo"><i>MALI</i><em></em><u>TOK</u></div><button class="snd" id="snd">Son coupé</button></div>
  <div class="feed" id="feed"></div>
  <div class="auth" id="auth">
    <div class="logo"><i>MALI</i><em></em><u>TOK</u></div>
    <input id="un" placeholder="Ton nom d’utilisateur" maxlength="20" style="display:none" autocomplete="username">
    <input id="em" type="email" placeholder="E-mail" autocomplete="email">
    <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="go" id="go">Se connecter</button>
    <button class="alt" id="alt">Pas de compte ? Créer un compte</button>
  </div>
  <div class="sheet" id="sheet" role="dialog">
    <div class="sh"><span id="ttl"></span><button id="close" aria-label="Fermer">×</button></div>
    <div class="list" id="list"></div>
    <div class="add-c"><input id="inp" maxlength="200"><button id="send">Envoyer</button></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<nav>
  <button id="home">Accueil</button>
  <button class="add" id="add" aria-label="Publier une vidéo">+</button>
  <button id="me">Profil</button>
</nav>
<input type="file" id="file" accept="video/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://hcltfvxyglnfvivzazzy.supabase.co","sb_publishable_PDIeGRRwoe-9vKUvHEe4jQ_wb4LSKE9");
var $=function(i){return document.getElementById(i)};
var me=null,muted=true,mode="c",cur=null,pend=null,signup=false,feed=$("feed");
var ico={h:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4A5.6 5.6 0 0 1 12 6.2a5.6 5.6 0 0 1 9.6 5.4C19.5 16.4 12 21 12 21z"/></svg>',c:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg>',s:'<svg viewBox="0 0 24 24"><path d="M4 13v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg>'};
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},2200)}
function name(){return (me&&me.user_metadata&&me.user_metadata.username)||"ami"}
function fr(m){if(/Invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";if(/already registered/i.test(m))return"Cet e-mail a déjà un compte. Connecte-toi.";if(/rate limit/i.test(m))return"Trop d’essais. Réessaie dans quelques minutes.";return m}
$("alt").onclick=function(){signup=!signup;$("un").style.display=signup?"block":"none";$("go").textContent=signup?"Créer mon compte":"Se connecter";this.textContent=signup?"Déjà un compte ? Se connecter":"Pas de compte ? Créer un compte";$("err").textContent=""};
$("go").onclick=async function(){var e=$("em").value.trim(),p=$("pw").value,u=$("un").value.trim();$("err").textContent="";
 if(!e||p.length<6||(signup&&u.length<2)){$("err").textContent=signup?"Remplis ton nom, ton e-mail et un mot de passe de 6 caractères minimum.":"Entre ton e-mail et ton mot de passe (6 caractères minimum).";return}
 this.disabled=true;
 var r=signup?await sb.auth.signUp({email:e,password:p,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email:e,password:p});
 this.disabled=false;
 if(r.error){$("err").textContent=fr(r.error.message);return}
 if(!r.data.session){$("err").textContent="Compte créé. Vérifie ton e-mail, puis connecte-toi."}};
sb.auth.onAuthStateChange(function(ev,s){me=s?s.user:null;$("auth").style.display=me?"none":"flex";if(me)setTimeout(load,0)});
var io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target.querySelector("video");if(!v)return;if(e.isIntersecting){v.muted=muted;v.play().catch(function(){})}else{v.pause()}})},{root:feed,threshold:.7});
async function load(){
 var r=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(30);
 if(r.error){toast("Chargement impossible");return}
 var ids=r.data.map(function(p){return p.id}),L=[],C=[];
 if(ids.length){L=(await sb.from("likes").select("post_id,user_id").in("post_id",ids)).data||[];C=(await sb.from("comments").select("post_id").in("post_id",ids)).data||[]}
 feed.innerHTML="";io.disconnect();
 if(!r.data.length){var n=document.createElement("div");n.className="none";n.textContent="Aucune vidéo pour l’instant. Publie la première avec le bouton +.";feed.appendChild(n);return}
 r.data.forEach(function(p){p.likes=L.filter(function(x){return x.post_id==p.id}).length;p.liked=L.some(function(x){return x.post_id==p.id&&x.user_id==me.id});p.nc=C.filter(function(x){return x.post_id==p.id}).length;feed.appendChild(mk(p))})}
function mk(p){
 var d=document.createElement("div");d.className="post";
 var v=document.createElement("video");v.className="bg";v.src=p.video_url;v.loop=true;v.playsInline=true;v.muted=true;v.preload="metadata";v.onclick=function(){v.paused?v.play():v.pause()};d.appendChild(v);
 var i=document.createElement("div");i.className="info";var u=document.createElement("b");u.textContent="@"+p.username;var c=document.createElement("span");c.textContent=p.caption||"";i.appendChild(u);i.appendChild(c);d.appendChild(i);
 var r=document.createElement("div");r.className="rail";
 var lb=document.createElement("button"),cb=document.createElement("button"),sb2=document.createElement("button");
 lb.setAttribute("aria-label","J’aime");cb.setAttribute("aria-label","Commentaires");sb2.setAttribute("aria-label","Partager");
 function draw(){lb.className=p.liked?"on":"";lb.innerHTML=ico.h+"<span>"+p.likes+"</span>";cb.innerHTML=ico.c+"<span>"+p.nc+"</span>"}
 draw();sb2.innerHTML=ico.s+"<span>Partager</span>";
 lb.onclick=async function(){var was=p.liked;p.liked=!was;p.likes+=was?-1:1;draw();
  var q=was?sb.from("likes").delete().match({post_id:p.id,user_id:me.id}):sb.from("likes").insert({post_id:p.id});
  var x=await q;if(x.error){p.liked=was;p.likes+=was?1:-1;draw();toast("Action impossible")}};
 cb.onclick=function(){open("c",p,draw)};
 sb2.onclick=function(){var data={title:"MALI TOK",text:p.caption||"Regarde cette vidéo sur MALI TOK",url:location.href};if(navigator.share){navigator.share(data).catch(function(){})}else{try{navigator.clipboard.writeText(location.href).then(function(){toast("Lien copié")})}catch(e){toast("Copie impossible")}}};
 r.appendChild(lb);r.appendChild(cb);r.appendChild(sb2);d.appendChild(r);io.observe(d);return d}
function open(m,p,draw){mode=m;cur={p:p,draw:draw};$("inp").value="";$("sheet").classList.add("open");
 if(m==="c"){$("ttl").textContent="Commentaires";$("inp").placeholder="Ajoute un commentaire…";$("send").textContent="Envoyer";comments()}
 else{$("ttl").textContent="Nouvelle vidéo";$("inp").placeholder="Écris une légende (facultatif)";$("send").textContent="Publier";$("list").textContent="Vidéo choisie : "+pend.name+" ("+(pend.size/1048576).toFixed(1)+" Mo)"}}
async function comments(){var l=$("list");l.textContent="Chargement…";var r=await sb.from("comments").select("username,body").eq("post_id",cur.p.id).order("created_at");
 if(r.error){l.textContent="Chargement impossible.";return}
 l.innerHTML="";if(!r.data.length){l.textContent="Aucun commentaire. Écris le premier.";return}
 r.data.forEach(function(k){var x=document.createElement("div");x.className="c";var b=document.createElement("b");b.textContent="@"+k.username+" ";x.appendChild(b);x.appendChild(document.createTextNode(k.body));l.appendChild(x)});l.scrollTop=l.scrollHeight}
$("close").onclick=function(){$("sheet").classList.remove("open")};
$("send").onclick=async function(){var t=$("inp").value.trim(),b=this;
 if(mode==="c"){if(!t){toast("Écris un commentaire d’abord");return}b.disabled=true;
  var r=await sb.from("comments").insert({post_id:cur.p.id,username:name(),body:t});b.disabled=false;
  if(r.error){toast("Envoi impossible");return}$("inp").value="";cur.p.nc++;cur.draw();comments();return}
 var f=pend;b.disabled=true;b.textContent="Envoi…";
 var ext=(f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,""),path=me.id+"/"+Date.now()+"."+ext;
 var u=await sb.storage.from("videos").upload(path,f,{contentType:f.type||"video/mp4"});
 if(u.error){toast("Envoi impossible : "+u.error.message);b.disabled=false;b.textContent="Publier";return}
 var url=sb.storage.from("videos").getPublicUrl(path).data.publicUrl;
 var i=await sb.from("posts").insert({username:name(),caption:t,video_url:url});
 b.disabled=false;b.textContent="Publier";
 if(i.error){toast("Publication impossible");return}
 $("sheet").classList.remove("open");pend=null;toast("Vidéo publiée");load();feed.scrollTo({top:0})};
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter")$("send").click()});
$("snd").onclick=function(){muted=!muted;this.textContent=muted?"Son coupé":"Son activé";feed.querySelectorAll("video").forEach(function(v){v.muted=muted})};
$("home").onclick=function(){load();feed.scrollTo({top:0,behavior:"smooth"})};
$("me").onclick=function(){if(confirm("Connecté en tant que "+name()+". Se déconnecter ?"))sb.auth.signOut()};
$("add").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];this.value="";if(!f)return;
 if(f.type&&f.type.indexOf("video")!==0){toast("Choisis un fichier vidéo");return}
 if(f.size>50*1000*1000){toast("Vidéo trop lourde (50 Mo maximum)");return}
 pend=f;open("p",null,null)};
</script>
</body></html>
